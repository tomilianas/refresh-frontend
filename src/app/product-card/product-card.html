<div class="product">
  <h2>{{product().title}}</h2>
  <div><img [src]="product().thumbnail" alt="{{product().title}}"></div>
  <p>Price: {{product().price | currency}}</p>
  @if (isAddedToCart){
  <button (click)="cartChange.emit(product()); isAddedToCart = false;">Remove from Cart</button>
  } @else {
  <button (click)="cartChange.emit(product()); isAddedToCart = true;">Add to Cart</button>
  }
</div>
